name: Auto Release + GitHub Packages
on:
  push:
    branches:
      - main
permissions:
  contents: write
  packages: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (patch)
        run: npm version patch -m "%s is probably stable because I tested it on my pc (no guarantees™)"

      - name: Verify distributable contents
        run: npm run test:package
      - name: Run proxy smoke test
        run: npm run test:proxy

      - name: Push commit + tags
        run: git push origin main --follow-tags

      - name: Read version + release message
        id: version
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

          # Grab the commit message npm version just created (with %s already substituted)
          {
            echo "msg<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------
      # GITHUB RELEASE
      # -----------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: v${{ steps.version.outputs.ver }}
          body: ${{ steps.version.outputs.msg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------
      # NPM AUTH
      # -----------------------
      - name: Setup npm auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------
      # FIXED DISPATCH TRIGGER (IMPORTANT)
      # -----------------------
      - name: Trigger CI tests
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: prefrontal-tests
